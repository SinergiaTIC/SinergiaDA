<html>
<head>
</head>
<body>
<script type="text/javascript">
        // Filled by scripts/copy-index.js with ENABLED_LANGUAGES (customizable_merged.ts). null = no restriction
        var enabledLanguages = null;

        var userLang = navigator.language || navigator.userLanguage;
        var targetLang = 'en';
        if(userLang.indexOf('ca') >=0){
                targetLang = 'ca';
        }else if(userLang.indexOf('gl') >=0){
                targetLang = 'gl';
        }else if(userLang.indexOf('es') >=0){
                targetLang = 'es';
        }

        // Language not enabled: fall back to 'en', or to the first enabled one if 'en' isn't enabled either
        if(enabledLanguages && enabledLanguages.length > 0 && enabledLanguages.indexOf(targetLang) < 0){
                targetLang = enabledLanguages.indexOf('en') >= 0 ? 'en' : enabledLanguages[0];
        }

        window.location.replace(window.location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '') + '/' + targetLang + '/');
</script>
</body>
</html>
