<html>
<head>
</head>
<body>
<script type="text/javascript">
        var userLang = navigator.language || navigator.userLanguage;
        if(userLang === 'ca-ES' || userLang.indexOf('ca') === 0){
                window.location.href = window.location.href.replace('/index.html','')+'/ca';
        }else if(userLang === 'gl-ES' || userLang.indexOf('gl') === 0){
                window.location.href = window.location.href.replace('/index.html','')+'/gl';
        }else if(userLang === 'eu-ES' || userLang.indexOf('eu') === 0){
                window.location.href = window.location.href.replace('/index.html','')+'/eu';
        }else if(userLang.indexOf('es') >=0){
                window.location.href = window.location.href.replace('/index.html','')+'/es';
        }else if(userLang.indexOf('pl') >=0){
                window.location.href = window.location.href.replace('/index.html','')+'/pl';
        }else if(userLang.indexOf('fr') >=0){
                window.location.href = window.location.href.replace('/index.html','')+'/fr';
        }else{
                window.location.href = window.location.href.replace('/index.html','')+'/en';
        }
</script>
</body>
</html>
