<div class="zoom-controls-simple" *ngIf="canIedit()">
    <button pButton pRipple type="button" class="p-button-rounded p-button-text p-button-plain zoom-btn-simple zoom-step-btn" (mousedown)="startContinuousZoom('out')" (mouseup)="stopContinuousZoom()" (mouseleave)="stopContinuousZoom()" (click)="zoomOut()" [disabled]="zoomLevel <= 25">
        <i class="fa fa-minus"></i>
    </button>
    <span class="zoom-value">{{zoomLevel}}%</span>
    <button pButton pRipple type="button" class="p-button-rounded p-button-text p-button-plain zoom-btn-simple zoom-step-btn" (mousedown)="startContinuousZoom('in')" (mouseup)="stopContinuousZoom()" (mouseleave)="stopContinuousZoom()" (click)="zoomIn()" [disabled]="zoomLevel >= 100">
        <i class="fa fa-plus"></i>
    </button>
    <div class="zoom-divider"></div>
    <button pButton pRipple type="button" class="p-button-rounded p-button-text p-button-plain zoom-btn-simple reset-btn" (click)="resetZoom()" [disabled]="zoomLevel === 100" pTooltip="Restablecer (100%)" tooltipPosition="bottom">
        <i class="fa fa-refresh"></i>
    </button>
</div>
