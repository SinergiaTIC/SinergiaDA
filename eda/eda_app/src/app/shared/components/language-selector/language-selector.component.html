<div class="relative" id="language-selector">
  <button type="button"
    class="flex items-center gap-1.5 rounded-md border border-input bg-background px-3 py-2 text-sm hover:bg-muted"
    i18n-title="@@languageSelectorTitle" title="Idioma"
    (click)="toggleOpen($event)">
    <i class="fa fa-globe text-muted-foreground"></i>
    <span>{{ currentLanguageLabel }}</span>
    <i class="fa fa-caret-down text-muted-foreground"></i>
  </button>
  @if (isOpen) {
    <div class="absolute right-0 z-50 mt-2 w-44 rounded-lg border bg-white shadow-lg">
      <div class="max-h-64 overflow-y-auto py-1">
        @for (lang of languages; track lang.code) {
          <a [href]="'/' + lang.code + '/'"
            class="flex items-center px-3 py-1.5 text-sm hover:bg-muted cursor-pointer"
            [class.font-semibold]="lang.code === currentLocale"
            [class.text-corporate-primary]="lang.code === currentLocale">
            {{ lang.nativeName }}
          </a>
        }
      </div>
    </div>
  }
</div>
